<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html">
<head>


    <style>
        body{font-family:metric;}

        #dataTableControl {
            position: absolute;
            z-index:1000;
            bottom: 10px;
            left: 10px;
        }

        #donutChartControl {
            position: absolute;
            z-index:1000;
            bottom: 10px;
            right: 10px;
        }

        #cellCoordsControl {
            position: absolute;
            z-index:1000;
            top: 10px;
            right: 10px;
        }

        #svg_div{
            position: absolute;
            z-index:1000;
        }

        #spot_tooltip {
            display: none;
            background: #d4d1d1;
            position: absolute;
            font-family: 'Helvetica Neue', monospace;
            padding: 0px;
            min-width:150px;
            max-width:250px;
            border-style: solid;
            border-color: #555555;
            border-width: 0.5px;
            z-index: 10000;
            opacity: 0.8;
        }

        td.tooltip_gene {
            font-size: large;
        }

        td {
            font-size: large;
            vertical-align: text-bottom;
        }

        td.label {
            text-align: left;
            font-size: large;
            font-weight: normal;
        }

        td.tooltip_spot_coord_x {
             font-size: large;
        }

        td.tooltip_spot_coord_y {
             font-size: large;
        }

        td.tooltip_spot_coord_z {
             font-size: large;
        }

        #GenePanelButton {
            top: 9px;
            left: 10px;
            cursor: pointer;
        }

        .map-content {
            position: absolute;
            z-index: 1000;
            padding: 4px 7px 5px;
            border-top: 1px solid #777;
            border-left: 1px solid #777;
            border-right: 2px solid #444;
            border-bottom: 2px solid #444;
            line-height: 1.6;
            font-size: 1em;
            /*font-family: Apercu-Light;*/
            background: white;
            -moz-border-radius: 5px;
            -webkit-border-radius: 5px;
            border-radius: 5px;
        }

        #jstree_demo {
            top: 10px;
            right: 10px;
            /*background-color: #C0C0C0;*/
            /*padding: 6px 10px 6px 6px;*/
            /*color: #333;*/
            /*background: #fff;*/
            /*position: absolute;*/
            /*z-index: 1000;*/
        }

    </style>

	<meta name="description" content="">
	<meta name="author" content="">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

	<link rel="stylesheet" type="text/css" href="./build/potree/potree.css">
	<link rel="stylesheet" type="text/css" href="./libs/jquery-ui/jquery-ui.min.css">
	<link rel="stylesheet" type="text/css" href="./libs/openlayers3/ol.css">
	<link rel="stylesheet" type="text/css" href="./libs/spectrum/spectrum.css">
	<link rel="stylesheet" type="text/css" href="./libs/jstree/themes/mixed/style.css">

    <!-- stylesheets -->
    <link rel="stylesheet" href="assets/bootstrap.min.css">

    <link rel="stylesheet" href="assets/index.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.10.19/css/jquery.dataTables.min.css">

</head>
<body>
	<script src="./libs/jquery/jquery-3.1.1.min.js"></script>

    <script src="https://cdn.datatables.net/1.10.19/js/jquery.dataTables.min.js"></script>

    <!-- bootstrap -->
    <script src="assets/bootstrap.min.js"></script>

    <!--user scripts -->
    <!-- classConfig must load BEFORE dt.js/donut.js so subtypeAt() is defined when they parse -->

    <!-- aang dataset (active) — swap to classConfig.js / glyphConfig.js to use hippocampus -->
    <script src="classConfig_aang.js"></script>
    <!-- <script src="classConfig.js"></script> -->
    <script src="dt.js"></script>
    <script src="donut.js"></script>
    <script src="assets/progress.js"></script>
    <script src="glyphConfig_aang.js"></script>

    <div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px; ">
        <div id="potree_render_area"></div>
        <div id="potree_sidebar_container"> </div>
<!--        <div id="jstree_demo" class="map-content"></div>-->



        <div class='tab-pane active fade in' id='cellCoordsControl'>
            <div class='container-fluid'>
                <div class='col-sm-12'>
                    <div class='row myTitle', id='cellCoordsControlText' style='margin-bottom:5px'>
                        <h4>Highlighted Cell</h4>
                    </div>
                </div>
            </div>
        </div>

        <div class="tab-pane active fade in" id="dataTableControl">
            <div class="container-fluid col-sm-12" style="background-color: darkgrey;">
                <table id='dtTable' class='display compact custom' data-page-length='5' width=100%></table>
            </div>
        </div>

        <div class='tab-pane active fade in' id='donutChartControl'>
            <div class='container-fluid'>
                <div class='row' style='background-color: rgba(255, 255, 255, 0.0)'>
                    <div class='chart-wrapper'>
                        <div class='chart-stage'>
                            <div class='col-sm-12'>
                                <div class='chart-stage' style='background-color: rgba(255, 255, 255, 0.0)'>
                                    <div class='summary' id='piechart'>
                                        <svg width='300' height='180'></svg>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <div class="container-fluid" id="preloader">
        <div id="stats-container" class="stack-top">
            <div class="loading">
                <div id="container"></div>
                <div id="loading" class="loading"><span>loading...</span></div>
                <div id="loading_perc" class="loading"><span>loading...</span></div>
                <div id="loading_mb" class="loading"><span>loading...</span></div>
                <div id="done" class="loading"><span></span></div>
            </div>
        </div>

        <div class="col-sm-12">
            <div class="midplaced">
                <div class="row">
                    <div id="specificChart" class="donut-size">
                        <div class="pie-wrapper">
                            <span class="label">
                                <span class="num">0</span><span class="smaller">%</span>
                            </span>
                            <div class="pie">
                                <div class="left-side half-circle"></div>
                                <div class="right-side half-circle"></div>
                            </div>
                            <div class="shadow"></div>
                        </div>
                    </div>
                </div>
<!--                        <div class="row">-->
<!--                            <div class="text-center">-->
<!--                                <p>Num of cells: <span id="datapoints" class="meter">0</span></p>-->
<!--                                <p>Size: <span id="mb" class="meter">0MB</span></p>-->
<!--                            </div>-->
<!--                        </div>-->

                <div class="col-sm-12" id="wait_chart">
                    Building the chart. Please wait...
                </div>
            </div>
        </div>



        <script>$('#wait_chart').hide()</script>
        <script>$('#stats-container').hide()</script>
    </div>

<!--    <svg id='example1' style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px; "></svg>-->

    <div id="spot_tooltip">
            <table style="border:none;outline:none;" >
                <tr>
                    <td class="label">Gene:</td>
                    <td class="tooltip_gene"></td>
                </tr>
                <tr>
                    <td class="label">x:</td>
                    <td class="tooltip_spot_coord_x"></td>
                </tr>
                <tr>
                    <td class="label">y:</td>
                    <td class="tooltip_spot_coord_y"></td>
                </tr>
                <tr>
                    <td class="label">z:</td>
                    <td class="tooltip_spot_coord_z"></td>
                </tr>
<!--                <tr>-->
<!--                    <td class="label">Note:</td>-->
<!--                    <td class="tooltip_note"></td>-->
<!--                </tr>-->
            </table>
        </div>
